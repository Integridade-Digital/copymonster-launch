# The CopyMonster SaaS bundle patch: the Cordis-native auth layer over the
# shipped web profile. Applied after `dsh-base` and `dsh-web-app`, it mounts the
# CopyMonster credentials composite, inserts the auth service (Typert Host
# Context adapter), its HTTP routes, and the cross-provider LLM fallback, and
# keeps the rest of the shipped DSH composition intact.
#
# Use it as a stacked bundle in a profile, or as an overlay on the shipped
# profile:
#   dsh --profile web --patch ./packages/bundle/copymonster/cordis.patch.yml

# The composite below is the single root `credentials` provider. The base
# `credentials-local` row is disabled as a standalone provider because Cordis
# permits one provider per service per scope; the composite mounts that same
# local provider on an isolated scope and delegates to it, so `.credentials.yaml`,
# `.env`, and authorization records keep working.
- id: credentials
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: 'You are CopyMonster AI, an autonomous copywriting and funnel agent.'
    personaSuffix: Your working directory is {{cwd}}.

- insert:
    # Composite credentials provider: Supabase runtime LLM keys in memory, with
    # the local provider as its delegate for every other reference.
    - id: llm-credentials-supabase
      name: '@deepseek-ai/dsh-host-llm-credentials-supabase'

    # Immutable CopyMonster identity prepended to every agent system prompt.
    - id: copymonster-identity
      name: '@deepseek-ai/dsh-host-copymonster-identity'

    # CopyMonster identity service (ctx.auth) + the `auth` Typert Context kind.
    - id: auth-context
      name: '@deepseek-ai/dsh-api-auth-context'

    # node:http routes on ctx.webServer that report the caller identity.
    - id: auth-http
      name: '@deepseek-ai/dsh-api-auth-http'

    # Brand image routes served with the correct media type and revalidating
    # cache headers, so a replaced logo shows without changing its URL.
    - id: brand-assets
      name: '@deepseek-ai/dsh-host-brand-assets'

    # Cross-provider failover: once the primary route's retry budget is spent
    # (or the failure is not retryable in place), redirect the step to the
    # fallback route for the rest of the turn. The `openrouter` route comes from
    # an `llm-pi-ai` provider profile in the settings document.
    - id: llm-fallback
      name: '@deepseek-ai/dsh-host-llm-fallback'
      config:
        rules:
          - primary: deepseek-official
            fallbackProvider: openrouter
            fallbackModel: openrouter/free

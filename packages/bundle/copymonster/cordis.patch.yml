# The CopyMonster SaaS bundle patch: the Cordis-native auth layer over the
# shipped web profile. Applied after `dsh-base` and `dsh-web-app`, it mounts the
# CopyMonster credentials composite, inserts the auth service (Typert Host
# Context adapter), its HTTP routes, and the cross-provider LLM fallback, and
# keeps the rest of the shipped DSH composition intact.
#
# Use it as a stacked bundle in a profile, or as an overlay on the shipped
# profile:
#   dsh --profile web --patch ./packages/bundle/copymonster/cordis.patch.yml

# The composite below is the single root `credentials` provider. The base
# `credentials-local` row is disabled as a standalone provider because Cordis
# permits one provider per service per scope; the composite mounts that same
# local provider on an isolated scope and delegates to it, so `.credentials.yaml`,
# `.env`, and authorization records keep working.
- id: credentials
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: 'You are CopyMonster AI, an autonomous copywriting and funnel agent.'
    personaSuffix: Your working directory is {{cwd}}.

- insert:
    # Brand DNA positioning context: prepends the creator's mapped positioning
    # to sessions created with a positioningMappingId (opt-in per session).
    # Inserted before copymonster-identity so the identity watermark stays
    # above the DNA block in the final assembly.
    - id: positioning-injection
      name: '@deepseek-ai/dsh-host-positioning-injection'

    # Composite credentials provider: Supabase runtime LLM keys in memory, with
    # the local provider as its delegate for every other reference.
    - id: llm-credentials-supabase
      name: '@deepseek-ai/dsh-host-llm-credentials-supabase'

    # Immutable CopyMonster identity prepended to every agent system prompt.
    - id: copymonster-identity
      name: '@deepseek-ai/dsh-host-copymonster-identity'

    # CopyMonster identity service (ctx.auth) + the `auth` Typert Context kind.
    - id: auth-context
      name: '@deepseek-ai/dsh-api-auth-context'

    # node:http routes on ctx.webServer that report the caller identity.
    - id: auth-http
      name: '@deepseek-ai/dsh-api-auth-http'

    # Brand image routes served with the correct media type and revalidating
    # cache headers, so a replaced logo shows without changing its URL.
    - id: brand-assets
      name: '@deepseek-ai/dsh-host-brand-assets'

    # Cross-provider failover: once the primary route's retry budget is spent
    # (or the failure is not retryable in place), redirect the step to the
    # fallback route for the rest of the turn. The `openrouter` route comes from
    # an `llm-pi-ai` provider profile in the settings document.
    - id: llm-fallback
      name: '@deepseek-ai/dsh-host-llm-fallback'
      config:
        rules:
          - primary: deepseek-official
            fallbackProvider: openrouter
            fallbackModel: openrouter/free

# CopyMonster's guided brand positioning consultant (Brand DNA). The web bundle
# owns the preset registry; this row declares the fork preset as one
# `@deepseek-ai/dsh-agent-preset` definition, so the CopyMonster overlay keeps
# applying it through the same `--patch` file as the rest of the SaaS layer.
- insert:
    - id: preset-brand-positioning-monster
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: brand-positioning-monster
        name: Brand Positioning Monster
        description: Guided brand positioning mapping agent
        order: 0
        plugins:
          # The `brand-positioning-monster` agent preset: CopyMonster's guided brand
          # positioning consultant, named by onboarding sessions (Etapa 3, /onboarding/dna).
          #
          # This file is an AGENT-PLANE composition, mounted under one agent's scope.
          # The persona row shadows the deployment persona (the CopyMonster bundle's
          # "CopyMonster AI" prefix) for sessions naming this preset, so the consultant
          # identity is the one the model reads. The host composition keeps everything a
          # preset must not own: registries, persistence, and the model route.
          #
          # Rows here only register into host registries (prompt sections, tools) and
          # provide nothing, so none needs an `isolate` realm.

          # ── identity ────────────────────────────────────────────────────────────────

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: ''
              prefix: |
                You are the Brand Positioning Monster, a senior brand positioning consultant with more than twenty years of experience extracting the commercial identity of products, offers, and personal brands. You conduct a guided strategic interview that maps the creator's brand into twelve blocks, one at a time.

                Opening: on the first turn of a new session, send the welcome message yourself. Greet the creator as their Brand Positioning Strategist, tell them you will guide them through a complete twelve-block brand mapping, and ask them to name their product or offer in one sentence.

                Interview protocol: walk the twelve blocks in order, asking exactly one question per block: 1 Target Audience; 2 Pains and Challenges; 3 Solution and Benefits; 4 Competitive Differentiator; 5 Awareness Stage; 6 Urgency and Scarcity; 7 Social Proof; 8 Objection Handling; 9 Emotional Connection; 10 Before and After Transformation; 11 Audience Voice; 12 Clear Promises. Blocks 2, 5, 6, 7, 8, and 12 are adaptive: when the creator asks to skip one, move on without pressure. After each answer, restate it as one to three paragraphs of polished high-persuasion commercial copy that captures the creator's positioning, then confirm the restate in one short line and ask the next block's question. Keep every question short and concrete: one block, one question, no lists of sub-questions. When block 12 is confirmed, close by summarizing the twelve blocks in clean commercial prose and tell the creator their Brand DNA mapping is complete.

                Language: detect the creator's language on every turn, starting with the welcome message, and respond in it (Portuguese, English, or Spanish); never mix languages in one reply.

                Identity: never name, describe, or imply the underlying model, provider, or vendor that powers you. If the creator asks which model you are, answer that you are the Brand Positioning Monster and continue the interview.

                Output format for every reply: plain commercial text for executives. No emojis, no asterisks, no hashtags, no markdown emphasis or headings, no tables, no decorative bullets, no code blocks. Never mention internal tools, third-party services, or external advertisements.

          # ── guided Q&A ──────────────────────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # ── CopyMonster DNA runtime ─────────────────────────────────────────────────

          # Host plugin activated in Etapa 5: prompt-waterfall listener and DNA
          # persistence for sessions that carry a positioningMappingId.
          - id: positioning-injection
            name: '@deepseek-ai/dsh-host-positioning-injection'

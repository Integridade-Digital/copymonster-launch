packages:
  - vendor/*
  - packages/*/*
  # The Landlock launcher is developed with its harness consumers but keeps
  # its native build and publication scripts under native/system.
  - native/system
  - native/system/packages/*
  # Product assemblies over the package tier; apps/cli owns the `dsh` bin.
  - apps/*
  # Private package owning repository-level benchmark dependencies.
  - benchmarks
  - website
  # Profile assemblies (copymonster-launch profiles)
  - .dsh/profiles/*
  # Deploy root of the single-exe build: a pure dependency manifest whose
  # closure is what the exe bundles and what the Python runtime distributes.
  - python/sdk-runtime

overrides:
  'extract-zip>yauzl': '3.4.0'
  '@deepseek-ai/cosmokit': 'link:vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:vendor/schemastery'
  # Security floors (SEC-014). Each one raises a transitive copy to its first
  # patched release without changing the direct dependents' own ranges.
  'zod': '^4.6.6'
  'undici@>=8.0.0 <8.12.2': '8.12.2'
  'undici@>=7.18.0 <7.30.1': '7.30.1'
  '@modelcontextprotocol/sdk@>=1.24.0 <1.32.0': '1.32.2'
  '@modelcontextprotocol/sdk@>=1.3.0 <1.32.0': '1.32.2'
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
  'follow-redirects@<1.16.2': '1.16.2'
  'happy-dom@>=17.0.0 <=21.0.3': '21.0.4'
  # Dev-only advisories (SEC-021): a prototype-pollution RCE in the test pool and
  # a DOMPurify bypass reachable through the docs toolchain.
  'tinypool@<=2.1.0': '2.1.2'
  'tinypool@>=2.1.1 <2.1.2': '2.1.2'
  'dompurify@>=3.4.4 <=3.4.16': '3.4.17'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

allowBuilds:
  esbuild: true
  lefthook: true
  node-pty: true
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  koffi: true
  '@deepseek-ai/dsh-subprocess-local@file:packages/subprocess/subprocess-local': true
  electron-winstaller: false
  msgpackr-extract: false


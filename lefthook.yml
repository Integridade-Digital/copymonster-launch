# Git hooks (lefthook). Keep these local checkpoints fast; CI owns the full
# repository-wide gate matrix.
# Install: `node scripts/install-lefthook.mjs` (runs automatically via postinstall).
pre-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-translation-pairing.ts --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-archived-agent-notes.ts

    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs}'
      exclude:
        - 'vendor/*/src/**'
      run: node_modules/.bin/tsx scripts/run-oxlint.ts --config .oxlintrc.staged.json --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: whitespace (staged)
      run: git diff --cached --check

    - name: pi-ai provider metadata
      glob: '{pnpm-lock.yaml,packages/llm/llm-pi-ai/package.json,packages/llm/llm-pi-ai/scripts/gen-provider-data.ts,packages/llm/llm-pi-ai/src/provider-data.generated.ts}'
      run: node_modules/.bin/tsx packages/llm/llm-pi-ai/scripts/gen-provider-data.ts --check --cached

    - name: vendor manifest guard
      run: scripts/check-vendor-manifest.sh

pre-merge-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-translation-pairing.ts --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-archived-agent-notes.ts

pre-push:
  jobs:
    # Package-scoped typecheck, not `pnpm run typecheck`.
    #
    # The aggregate programs the CI lane compiles (tsconfig.host.json,
    # tsconfig.client.json) currently carry errors the repository has not
    # adopted yet: ~170 Client and ~18 Host errors across test files, plus Vite 8
    # plugin-typing drift in apps/web/katex-fonts.ts and
    # apps/web/product-isolation.ts. Running them here failed every push
    # regardless of what the push changed, and a full Host compile needs several
    # GiB and minutes.
    #
    # scripts/typecheck-changed.ts maps each changed source file to the package
    # that owns it and compiles that package's own tsconfig, so a push that
    # breaks a package's source still fails. Test programs and the two drift
    # files stay with the CI typecheck lane
    # (.github/workflows/ci-master.yml), which remains the authoritative gate.
    - name: typecheck (changed packages)
      run: node_modules/.bin/tsx scripts/typecheck-changed.ts

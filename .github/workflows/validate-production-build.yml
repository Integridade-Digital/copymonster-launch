name: Validate production build
on:
  push:
    branches: [test/production-build-validation]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DSH_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=9216
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4abbd090f180270bbc40734beb9e3153d9f576ad
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:artifacts
      - name: Type-check the client test suite
        run: pnpm exec tsc -p tsconfig.client.json --pretty false
        env:
          DSH_GATE_CONCURRENCY: '1'

# dsh-experimental-zernio-mcp bundle patch: inserts the plugin row into the
# profile roster. Applied as a profile bundle layer (declared by the
# `dsh.bundle.patch` manifest field in package.json). Activate with:
#
#   dsh plugin --profile web add link:/path/to/zernio-mcp
- insert:
    - id: zernio-mcp
      name: '@deepseek-ai/dsh-experimental-zernio-mcp'
      config:
        announceToAgent: true   # announce the plugin and its tool namespace to the model
        enabled: true           # plugin master switch
